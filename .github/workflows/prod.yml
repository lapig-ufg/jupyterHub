name: Deploy JupyterHub (srv3)

on:
  push:
    branches:
      - main
  workflow_dispatch:   # permite rodar manualmente pela aba Actions

permissions:
  contents: read

# Se houver dois pushes seguidos, o segundo deploy espera o primeiro terminar.
concurrency:
  group: deploy-jupyterhub
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # DEPLOY: roda no runner do srv3.
  #
  # Este repositório não builda imagem a cada push: as imagens do Hub e do
  # monitor são versionadas à mão (ver README). O que muda no dia a dia são
  # os arquivos (compose, jupyterhub_config.py), então o deploy:
  #   1. atualiza o clone do repositório no servidor (/services/jupyterHub);
  #   2. aplica a stack prod_jupyterHub com o caretaker;
  #   3. reinicia o Hub, para ele reler o jupyterhub_config.py.
  # ---------------------------------------------------------------------------
  deploy:
    runs-on: [self-hosted, srv3-github-runner]
    env:
      APP_NAME: ${{ github.event.repository.name }}   # jupyterHub
      APP_TYPE: prod

    steps:
      - name: Atualizar os arquivos no servidor
        run: git -c safe.directory="/services/$APP_NAME" -C "/services/$APP_NAME" pull --ff-only

      - name: Deploy da stack com o caretaker
        run: caretaker "$APP_NAME" "$APP_TYPE"

      - name: Reiniciar o Hub (recarrega o jupyterhub_config.py)
        run: docker service update --force --detach=false "${APP_TYPE}_${APP_NAME}_jupyterhub"