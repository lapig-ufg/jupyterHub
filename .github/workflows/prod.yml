name: Build and Deploy JupyterHub (srv3)

on:
  push:
    branches:
      - main
  workflow_dispatch:   # rodar à mão (Run workflow) sempre gera as imagens

permissions:
  contents: read

# Se houver dois pushes seguidos, o segundo espera o primeiro terminar.
concurrency:
  group: deploy-jupyterhub
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # BUILD: roda nas máquinas do GitHub, uma vez para cada imagem da lista.
  # Cada imagem é enviada ao Docker Hub como prod_<commit> e prod_latest.
  #
  # Uma imagem só é gerada quando:
  #   - algum arquivo da pasta dela mudou neste push; ou
  #   - o workflow foi disparado à mão (Run workflow); ou
  #   - a tag prod_latest dela ainda não existe no Docker Hub.
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: hub
            image: lapig/jupyterhub-sci2
            context: docker
            dockerfile: docker/Dockerfile.hub
          - name: monitor
            image: lapig/jupyterhub-sci2-monitor
            context: health-check
            dockerfile: health-check/Dockerfile
    env:
      IMAGE: ${{ matrix.image }}
      CONTEXT: ${{ matrix.context }}
      DOCKERFILE: ${{ matrix.dockerfile }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # histórico completo, para comparar com o push anterior

      - name: Login no Docker Hub
        env:
          DOCKERHUB_PASS: ${{ secrets.DOCKERHUB_PASS }}
        run: echo "$DOCKERHUB_PASS" | docker login -u lapig --password-stdin

      - name: Decidir se a imagem precisa ser gerada
        id: check
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Disparo manual: a imagem será gerada."
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif ! docker manifest inspect "$IMAGE:prod_latest" > /dev/null 2>&1; then
            echo "$IMAGE:prod_latest ainda não existe: a imagem será gerada."
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- "$CONTEXT" 2>/dev/null; then
            echo "A pasta $CONTEXT mudou: a imagem será gerada."
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nada mudou em $CONTEXT: o deploy vai usar a imagem já publicada."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build da imagem
        if: steps.check.outputs.build == 'true'
        run: |
          docker build \
            -f "$DOCKERFILE" \
            -t "$IMAGE:prod_${GITHUB_SHA::7}" \
            -t "$IMAGE:prod_latest" \
            "$CONTEXT"

      - name: Enviar a imagem ao Docker Hub
        if: steps.check.outputs.build == 'true'
        run: |
          docker push "$IMAGE:prod_${GITHUB_SHA::7}"
          docker push "$IMAGE:prod_latest"

  # ---------------------------------------------------------------------------
  # DEPLOY: roda no runner do srv3, depois que todas as imagens estiverem prontas.
  #   1. atualiza o clone do repositório no servidor (/services/jupyterHub);
  #   2. aplica a stack prod_jupyterHub com o caretaker (que baixa as
  #      imagens prod_latest mais recentes);
  #   3. reinicia o Hub, para ele reler o jupyterhub_config.py.
  # ---------------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: [self-hosted, srv3-github-runner]
    env:
      APP_NAME: ${{ github.event.repository.name }}   # jupyterHub
      APP_TYPE: prod

    steps:
      - name: Atualizar os arquivos no servidor
        run: git -c safe.directory="/services/$APP_NAME" -C "/services/$APP_NAME" pull --ff-only

      - name: Deploy da stack com o caretaker
        run: caretaker "$APP_NAME" "$APP_TYPE"

      - name: Reiniciar o Hub (recarrega o jupyterhub_config.py)
        run: docker service update --force --detach=false "${APP_TYPE}_${APP_NAME}_jupyterhub"