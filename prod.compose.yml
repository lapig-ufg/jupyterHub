services:
  glances:
    image: nicolargo/glances:latest
    environment:
      - GLANCES_OPT=-w
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    pid: host
    ports:
      - "9011:61208"
    networks:
      - jupyterhub-network
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 100M

  monitor:
    image: lapig/jupyterhub-sci2-monitor:prod_latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # acesso somente-leitura ao socket
      - /home/lapig/applications/services/jupyterHub/logs:/logs  # onde os logs serão salvos
    environment:
      - MONITOR_INTERVAL=60        # intervalo de coleta em segundos
      - MEM_WARN_PERCENT=90        # % de RAM para gerar WARNING
      - LOGS_BASE=/logs
    networks:
      - jupyterhub-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  jupyterhub:
    image: lapig/jupyterhub-sci2:prod_latest
    hostname: jupyterhub
    volumes:
      - /home/lapig/applications/services/jupyterHub/var/db:/srv/jupyterhub
      - /home/lapig/applications/services/jupyterHub/scripts:/srv/jupyterhub/scripts
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/lapig/applications/services/jupyterHub/data/users.json:/srv/jupyterhub/users.json:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - jupyterhub-network
    command: >
      jupyterhub -f /srv/jupyterhub/scripts/jupyterhub_config.py
    env_file:
      - ./.env
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.jupyterhub2.service=jupyterhub2"
        - "traefik.docker.network=jupyterhub-network"
        - "traefik.http.services.jupyterhub2.loadbalancer.server.port=443"
        - "traefik.http.services.jupyterhub2.loadbalancer.server.scheme=http"
        - "traefik.http.routers.jupyterhub2.rule=Host(`sci2.lapig.iesa.ufg.br`)"
        - "traefik.http.routers.jupyterhub2.tls.certresolver=le"
        - "traefik.http.routers.jupyterhub2.entrypoints=websecure"
        # /hub/login -> /hub/oauth_login (vai direto para o Keycloak, mantém o ?next=...)
        - 'traefik.http.middlewares.jhub-autologin.redirectregex.regex=^https://sci2\.lapig\.iesa\.ufg\.br/hub/login(\?.*)?$$'
        - 'traefik.http.middlewares.jhub-autologin.redirectregex.replacement=https://sci2.lapig.iesa.ufg.br/hub/oauth_login$${1}'
        - "traefik.http.middlewares.jhub-autologin.redirectregex.permanent=false"
        - "traefik.http.routers.jupyterhub2.middlewares=jhub-autologin"

networks:
  jupyterhub-network:
    external: true
    name: jupyterhub-network