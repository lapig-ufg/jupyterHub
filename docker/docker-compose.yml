services:
  glances:
    image: nicolargo/glances:latest
    environment:
      - GLANCES_OPT=-w
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    pid: host
    ports:
      - "9011:61208"
    networks:
      - web_lapig_sci2
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 100M

  jupyterhub:
    image: lapig/geojupyterhub:v1
    hostname: jupyterhub
    volumes:
      - ../var/db:/srv/jupyterhub
      - ../scripts:/srv/jupyterhub/scripts
      - /var/run/docker.sock:/var/run/docker.sock
      - ../data/users.json:/srv/jupyterhub/users.json:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - web_lapig_sci2
    command: >
      jupyterhub -f /srv/jupyterhub/scripts/jupyterhub_config.py
    env_file:
      - ../.env
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.jupyterhub2.service=jupyterhub2"
        - "traefik.docker.network=web_lapig"
        - "traefik.http.services.jupyterhub2.loadbalancer.server.port=443"
        - "traefik.http.services.jupyterhub2.loadbalancer.server.scheme=http"
        - "traefik.http.routers.jupyterhub2.rule=Host(`sci2.lapig.iesa.ufg.br`)"
        - "traefik.http.routers.jupyterhub2.tls.certresolver=le"
        - "traefik.http.routers.jupyterhub2.entrypoints=websecure"

networks:
  web_lapig_sci2:
    external: true
    name: web_lapig_sci2